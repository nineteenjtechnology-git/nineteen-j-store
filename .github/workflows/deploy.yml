name: Deploy Nineteen J Store

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # relancer à la main (ex. après avoir publié une app dans l'admin)
  schedule:
    - cron: '17 3 * * *'    # chaque nuit : régénère les fiches SEO + sitemap depuis Supabase

# Principe du moindre privilège : le workflow ne peut que lire le dépôt.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA de commit (audit M6) - à mettre à jour volontairement
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install (outillage de build uniquement)
        run: npm ci

      - name: Syntaxe JS (bloquant)
        run: |
          for f in public/js/*.js public/sw.js; do node --check "$f"; done

      - name: Intégrité des scripts vendorisés (SHA-256)
        working-directory: public
        run: sha256sum --check js/vendor/SHA256SUMS.txt

      - name: Build du CSS Tailwind
        run: npm run build:css

      - name: Audit des dépendances de build (bloquant à partir de "high")
        run: npm audit --audit-level=high

  deploy:
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # permet d'exiger une approbation manuelle (Settings > Environments)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css

      # Pré-rendu SEO : fiches /apps/<slug>, sitemap.xml, liste d'apps de l'accueil (lecture publique Supabase, aucun secret).
      - name: Pré-rendu SEO
        run: npm run build:seo

      # Compte de service au rôle minimal (Firebase Hosting Admin) au lieu d'un
      # jeton personnel longue durée (`firebase login:ci`, déprécié).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Health check
        run: |
          sleep 8
          curl -sSf "${{ secrets.HOSTING_URL }}" -o /dev/null \
            || (echo "Health check échoué - envisager un rollback (voir README)" && exit 1)

      - name: Contrôles SEO post-déploiement
        run: |
          base="${{ secrets.HOSTING_URL }}"
          curl -sSf "$base/robots.txt" | grep -q "Sitemap:" || (echo "robots.txt sans Sitemap" && exit 1)
          curl -sSf "$base/sitemap.xml" | grep -q "<urlset" || (echo "sitemap.xml invalide" && exit 1)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/page-qui-nexiste-pas-$RANDOM")
          [ "$code" = "404" ] || (echo "Une URL inconnue doit répondre 404 (reçu $code)" && exit 1)
